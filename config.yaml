# Cấu hình CEH Toolkit
general:
  timeout: 300
  threads: 4
  output_dir: "./output"
  log_level: "INFO"
  plugin_dir: "./plugins"

# Multi-tenant
tenancy:
  enabled: true
  jwt_secret: "${JWT_SECRET}"
  default_plan: "free"
  quota:
    free:       {scans_per_day: 5,   targets_per_scan: 1}
    pro:        {scans_per_day: 100, targets_per_scan: 20}
    enterprise: {scans_per_day: -1,  targets_per_scan: -1}

# Các module được kích hoạt theo mặc định
enabled_modules:
  # --- Cũ ---
  - m02_footprinting
  - m03_scanning
  - m04_enumeration
  - m05_vuln_analysis
  - m11_web_hacking
  - m06_system_hacking
  - m08_sniffing
  - m13_wireless
  - m16_cloud
  - agentless_scan
  - threat_intel
  - msf_automation
  - mobile_scan
  - container_scan
  - iac_scan
  - fuzzing
  - adversary_emulation
  - purple_team
  - cloud_native
  - ai_triage
  - compliance_auto
  - threat_model
  - bug_bounty
  - blockchain_audit
  - ot_ics
  # --- Mới (Bỏ comment để bật) ---
  - continuous_fuzzing
  - exploit_gen
  - detection_codegen
  - soc_agent
  - supply_chain
  - runtime_enforce
  - deception
  - threat_hunting
  - c2_automation
  - pqc_audit

campaign:
  chain: true
  auto_resolve_after_misses: 3
  schedule:
    mode: "cron"
    cron: "0 */6 * * *"
    interval_hours: 6

siem:
  backend: null
  splunk:
    hec_url: "${SPLUNK_HEC_URL}"
    hec_token: "${SPLUNK_HEC_TOKEN}"
  elasticsearch:
    url: "${ELASTIC_URL}"
    user: "${ELASTIC_USER}"
    pass: "${ELASTIC_PASS}"
  syslog:
    host: "${SYSLOG_HOST}"
    port: 514

integrations:
  jira:
    enabled: false
  slack:
    enabled: false
  defectdojo:
    enabled: false

evasion:
  default_level: "none"
  proxy: false

# Cấu hình từng module
modules:
  m02_footprinting:
    whois: true
    dns: true
    subdomain_bruteforce: false
    theharvester: true
    google_dorks: true
    subdomain_wordlist: null

  m03_scanning:
    scan_type: "service"
    ports: "1-1000"
    timing: "T4"
    timeout: null

  m04_enumeration:
    smb: true
    snmp: true
    ldap: true
    nfs: true
    smtp: true

  m05_vuln_analysis:
    searchsploit: true
    nikto: true
    sslscan: true

  m11_web_hacking:
    nikto: true
    whatweb: true
    wpscan: false
    dirb: true
    dirb_wordlist: null

  m06_system_hacking:
    hydra: true
    hash_identify: true
    john: false
    hashcat: false
    user_wordlist: "./wordlists/users_small.txt"
    pass_wordlist: "./wordlists/passwords_small.txt"
    hash_file: null
    hash_value: null
    hash_mode: "0"

  m08_sniffing:
    iface: "eth0"
    duration: 30
    bpf_filter: ""
    tcpdump: true
    arp_scan: true
    arp_spoof_detect: true
    subnet: "192.168.1.0/24"

  m13_wireless:
    iface: "wlan0"
    monitor_mode: false
    scan: true
    scan_duration: 30
    deauth: false
    crack_handshake: false
    capture_file: null
    bssid: null
    client: null
    count: 10
    wordlist: "/usr/share/wordlists/rockyou.txt"

  m16_cloud:
    provider: "aws"
    profile: null
    regions: "us-east-1"
    prowler: true
    scoutsuite: false
    cloudfox: false

  agentless_scan:
    ssh:
      user: "root"
      password: "${SSH_PASSWORD}"
      key_path: null
    lynis: true
    openscap: false
    oscap_profile: "xccdf_org.ssgproject.content_profile_cis"
    cis_audit: false

  threat_intel:
    sources: ["vt", "internetdb", "abuse", "greynoise", "otx"]

  msf_automation:
    enabled: false
    host: "127.0.0.1"
    port: 55553
    password: "${MSF_PASSWORD}"
    auto_exploit: false
    payload: "linux/x64/meterpreter/reverse_tcp"
    wait: 15

  mobile_scan:
    base_url: "http://localhost:8000"
    api_key: "${MOBSF_API_KEY}"
    apk_path: null
    rescan: false

  container_scan:
    image: null
    k8s_cluster: false
    kube_hunter: false
    k8s_api: null
    cidr: null

  iac_scan:
    path: null
    checkov: true
    tfsec: true
    framework: null
    soft_fail: true

  fuzzing:
    afl:
      binary: "/path/to/target"
      corpus: "/path/to/corpus"
      source_dir: "/path/to/src"
      timeout: 3600
      dictionary: null
      cmplog: false
      instrument: false
    boofuzz:
      host: "127.0.0.1"
      port: 8080
      proto: "tcp"
      template: "http"
      timeout: 1800
      crash_dir: "/tmp/boofuzz_crashes"

  adversary_emulation:
    caldera:
      enabled: false
      url: "http://localhost:8888"
      api_key: "${CALDERA_API_KEY}"
      adversary_id: null
      group: "red"
    atomic:
      enabled: false
      techniques: ["T1059.001", "T1003.001", "T1055"]
      target: "local"
      cleanup: false

  purple_team:
    detection_source: "splunk"
    splunk_url: "${SPLUNK_URL}"
    splunk_token: "${SPLUNK_TOKEN}"
    elastic_url: "${ELASTIC_URL}"
    techniques: ["T1059.001", "T1003.001", "T1055"]
    time_window_sec: 300

  cloud_native:
    falco:
      rules_file: null
      helm_deploy: false
      release: "falco"
      namespace: "falco"
      values: null
    custodian:
      policy_file: null
      dry_run: true
      region: "us-east-1"

  ai_triage:
    llm_provider: "anthropic"
    findings: []

  compliance_auto:
    framework: "soc2"
    output_dir: "./compliance_evidence"
    aws:
      profile: null
      region: "us-east-1"

  threat_model:
    provider: "anthropic"
    description: null
    repo_url: null

  bug_bounty:
    scope_csv: null
    scope_json: null
    targets: []
    auto_scan: false

  blockchain_audit:
    contract_path: null
    slither: true
    mythril: false
    detectors: null

  ot_ics:
    protocols: ["modbus", "dnp3", "s7", "bacnet"]
    safe: true

  # ============================================================
  # CẤU HÌNH CÁC MODULE MỚI NÂNG CAO
  # ============================================================
  continuous_fuzzing:
    ossfuzz_dir: "/opt/oss-fuzz"
    setup: false
    project: "myproject"
    build: true
    sanitizer: "address"
    run: false
    harness: "fuzz_target"
    seconds: 60
    coverage: false
    clusterfuzz_url: null

  exploit_gen:
    provider: "anthropic"
    crash_output: null
    crash_file: null
    source_file: null
    binary: null
    binary_info:
      pie: true
      nx: true
      canary: true

  detection_codegen:
    provider: "anthropic"
    descriptions:
      - text: "Brute force trên admin login endpoint"
        technique: "T1110.001"
        level: "high"
    gaps: ["T1003.001", "T1055"]
    rule_dir: null

  soc_agent:
    provider: "anthropic"
    splunk_mcp_url: "${SPLUNK_MCP_URL}"
    splunk_mcp_token: "${SPLUNK_MCP_TOKEN}"
    splunk_query: "search index=notable | head 20"
    slack_webhook: "${SLACK_WEBHOOK_URL}"
    alerts: []

  supply_chain:
    target_image: null
    source_dir: null
    sbom: true
    sbom_format: "cyclonedx-json"
    scan: true
    fail_on: "critical"
    sign: false
    slsa:
      builder_id: "https://github.com/actions/runner"
      source_uri: "https://github.com/org/repo"
      commit_sha: "abc123"
    verify_image: null
    identity_regexp: null
    oidc_issuer: null

  runtime_enforce:
    tetragon:
      presets: ["kill_shell_spawn", "block_ptrace", "monitor_privileged"]
      auto_apply: false
      get_events: false
      namespace: "default"
    kubearmor:
      name: "ceh-restrict"
      selector: {app: "web"}
      process_action: "Block"
      file_action: "Block"
      auto_apply: false

  deception:
    llm_deception:
      provider: "anthropic"
      system_type: "ubuntu"
      test_inputs: ["whoami", "cat /etc/passwd", "sudo -l"]
    tpot:
      elastic_url: "${TPOT_ELASTIC_URL}"
      hours: 24

  threat_hunting:
    elastic_url: "${ELASTIC_URL}"
    index: "logs-*"
    hours: 24
    techniques: ["T1059.001", "T1003.001", "T1055", "T1071.001"]
    spark_input: null
    spark_output: null
    spark_master: "local[*]"

  c2_automation:
    start_listener:
      protocol: "mtls"
      lhost: "0.0.0.0"
      lport: 8888
    generate:
      name: "ceh-implant"
      os: "linux"
      arch: "amd64"
      format: "elf"
      c2_url: "mtls://127.0.0.1:8888"
      beacon: false
      save: "/tmp/implant"
    list_sessions: true
    list_beacons: false
    execute: []
    socks5: null

  pqc_audit:
    path: null
    exclude_dirs: ["vendor", "third_party", "node_modules", ".git"]
    fail_on_critical: false